services:
  - type: web
    name: democracy-with-ease
    runtime: python-3.14
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_render_admin && gunicorn simplevote.wsgi:application
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: DJANGO_SETTINGS_MODULE
        value: simplevote.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "democracy-with-ease.onrender.com,simplevote.it.com,www.simplevote.it.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://democracy-with-ease.onrender.com,https://simplevote.it.com,https://www.simplevote.it.com"
      - key: SITE_DOMAIN
        value: "simplevote.it.com"
      - key: SITE_SCHEME
        value: "https"
      - key: ACTIVITY_EMAIL_NOTIFICATIONS
        value: "True"
      - key: DATABASE_URL
        sync: false
